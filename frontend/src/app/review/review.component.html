<div class="review">
  <header class="review__header pc-pixel-text">
    <button class="review__back" type="button" (click)="backToDashboard()">&larr; Dashboard</button>
    <h1>{{ deckTitle() }}</h1>
    <div class="hud__gold">
      <span aria-hidden="true">◆</span>
      <span>{{ player.gold() }}</span>
    </div>
  </header>

  <p class="review__loading pc-pixel-text" *ngIf="isLoading()">Carregando fila...</p>

  <div class="panel review__empty" *ngIf="isEmpty()">
    <p class="pc-pixel-text">Este baralho ainda não tem cartas.</p>
    <p class="review__empty-hint">Crie a primeira carta pra começar a estudar.</p>
    <a class="pixel-button" [routerLink]="['/decks', deckId()]">Gerenciar Baralho</a>
  </div>

  <ng-container *ngIf="!isLoading() && !isEmpty()">
    <p class="review__session-gold pc-pixel-text">+{{ sessionGoldEarned() }} Gold nesta sessão</p>

    <div class="flip-card" [class.is-flipped]="isRevealed()" *ngIf="currentCard() as card">
      <div class="flip-card__inner">
        <div class="flip-card__face flip-card__face--front">
          <span class="flip-card__hint">Pergunta</span>
          <p>{{ card.front }}</p>
        </div>
        <div class="flip-card__face flip-card__face--back">
          <span class="flip-card__hint">Resposta</span>
          <p>{{ card.back }}</p>
        </div>
      </div>
    </div>

    <p class="reward-chip pc-pixel-text" *ngIf="lastCardGold() !== null">+{{ lastCardGold() }} Gold</p>

    <div class="review__actions" *ngIf="!isRevealed()">
      <button class="pixel-button" type="button" (click)="reveal()">Mostrar Resposta</button>
    </div>

    <div class="review__ratings" *ngIf="isRevealed()">
      <button class="rating-button rating-button--again" type="button" [disabled]="isSubmitting()" (click)="rate(false)">
        Errei
      </button>
      <button class="rating-button rating-button--good" type="button" [disabled]="isSubmitting()" (click)="rate(true)">
        Acertei
      </button>
    </div>
  </ng-container>
</div>
